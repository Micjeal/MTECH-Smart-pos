<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>MTECH POS · Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 80% 0,
            rgba(15, 118, 110, 0.13),
            transparent 34%
          ),
          #f3f7f6;
        color: #102421;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: min(440px, 100%);
        padding: 34px;
        border: 1px solid #dce8e5;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 28px 80px rgba(14, 65, 56, 0.13);
      }
      .mark {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #17a08f, #0f766e);
        color: #fff;
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
      }
      .mark svg {
        width: 29px;
        height: 29px;
        fill: currentColor;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.03em;
        margin: 24px 0 9px;
      }
      p {
        color: #667a76;
        font-size: 14px;
        line-height: 1.65;
        margin: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 20px 0;
        padding: 12px 13px;
        border-radius: 13px;
        background: #e9f8f5;
        color: #0a5b55;
        font-size: 12px;
        font-weight: 700;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #0f766e;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 13px;
        background: linear-gradient(135deg, #0f766e, #0a5b55);
        color: #fff;
        padding: 13px 18px;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 12px 24px rgba(15, 118, 110, 0.2);
      }
      small {
        display: block;
        text-align: center;
        color: #839590;
        font-size: 11px;
        margin-top: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M4 4h16l1 5H3l1-5Zm1 7h14v9H5v-9Zm3 2v5h4v-5H8Zm6 0v3h3v-3h-3Z"
          />
        </svg>
      </div>
      <h1>Your POS is offline</h1>
      <p>
        Sales and product images remain available after the application has
        completed its first successful installation. Reopen the workspace to
        continue.
      </p>
      <div class="status">
        <span class="dot"></span>Local data stays on this device
      </div>
      <button type="button" onclick="location.href='/'">Open MTECH POS</button>
      <small
        >If this is your first visit, reconnect once so the app can finish
        installing.</small
      >
    </main>
  </body>
</html>
